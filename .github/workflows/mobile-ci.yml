name: mobile-ci

# EDT 1.3.4.1. Ver docs/09-despliegue.md §9.4.
# lint+test corren en cada push/PR que toque mobile/. El build con EAS solo
# se dispara al pushear un tag de versión (ej. v1.0.0), para no consumir
# cuota de build en cada commit.
#
# Requiere el secret EXPO_TOKEN en el repo (Settings > Secrets and variables
# > Actions) para el job eas-build: un token de acceso de Expo
# (https://expo.dev/accounts/[cuenta]/settings/access-tokens). Sin ese
# secret configurado, eas-build va a fallar en el paso de login.

on:
  push:
    branches: [master, production]
    paths:
      - "mobile/**"
      - ".github/workflows/mobile-ci.yml"
    tags:
      - "v*"
  pull_request:
    paths:
      - "mobile/**"

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: mobile/package-lock.json

      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      # --passWithNoTests: todavía no hay specs escritos en mobile/ (ver
      # docs/08-plan-de-pruebas.md); sin esto, jest falla con "no tests
      # found" y bloquearía el CI por algo que no es un error real. Sacar
      # la flag el día que se agregue el primer test.
      - run: npm test -- --passWithNoTests

  eas-build:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: lint-and-test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: mobile/package-lock.json

      - run: npm ci

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - run: eas build --platform android --profile preview --non-interactive
